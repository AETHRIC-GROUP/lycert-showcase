[build]
builder = "RAILPACK"

[deploy]
startCommand = "python start.py"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.staging.deploy]
startCommand = "python start.py"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
